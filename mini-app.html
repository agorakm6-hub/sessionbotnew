<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Аккаунт-менеджер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0e1621;
    --panel: #17212b;
    --panel-hover: #1c2733;
    --accent: #5288c1;
    --accent-bright: #6ab3f3;
    --text: #e1e3e6;
    --text-dim: #6d7f8f;
    --bubble-out: #2b5278;
    --bubble-in: #182533;
    --border: #101921;
    --header-h: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #screen-list, #screen-chat { position: absolute; inset: 0; display: flex; flex-direction: column; }
  #screen-chat { transform: translateX(100%); transition: transform .25s cubic-bezier(.4,0,.2,1); }
  #screen-chat.active { transform: translateX(0); }

  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: calc(10px + var(--header-h)) 14px 10px; background: var(--panel);
    box-shadow: 0 1px 0 rgba(0,0,0,.35);
    flex-shrink: 0;
  }
  .topbar h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: -.2px; }
  .back-btn {
    font-size: 28px; color: var(--accent-bright); cursor: pointer; user-select: none;
    line-height: 1; margin-right: -2px; font-weight: 300;
  }
  .chat-header-avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; color: #fff;
  }

  .search-wrap { padding: 6px 10px 8px; background: var(--panel); flex-shrink: 0; }
  .search-box {
    background: var(--panel-hover); border-radius: 10px; padding: 8px 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .search-box .icon { color: var(--text-dim); font-size: 15px; }
  .search-box input {
    flex: 1; background: transparent; border: none; outline: none; color: var(--text);
    font-size: 15px; font-family: inherit;
  }
  .search-box input::placeholder { color: var(--text-dim); }

  #dialogs { flex: 1; overflow-y: auto; }
  .dialog-item {
    display: flex; align-items: center; gap: 12px; padding: 9px 14px;
    cursor: pointer;
  }
  .dialog-item:active { background: var(--panel-hover); }
  .avatar {
    width: 50px; height: 50px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; font-weight: 600; color: #fff;
  }
  .dialog-info { flex: 1; min-width: 0; border-bottom: 1px solid var(--border); padding-bottom: 9px; }
  .dialog-top-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .dialog-name { font-weight: 600; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dialog-last { font-size: 13.5px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; max-width: 78%; }
  .dialog-bottom-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
  .dialog-time { font-size: 12.5px; color: var(--text-dim); flex-shrink: 0; }
  .unread-badge {
    background: var(--accent-bright); color: #0e1621; font-size: 12px; font-weight: 700;
    border-radius: 10px; min-width: 20px; height: 20px; padding: 0 6px;
    display: flex; align-items: center; justify-content: center;
  }

  #messages {
    flex: 1; overflow-y: auto; padding: 10px 10px 14px; display: flex; flex-direction: column; gap: 3px;
    background-image: radial-gradient(circle at 20% 20%, rgba(82,136,193,.06), transparent 40%),
                       radial-gradient(circle at 80% 70%, rgba(82,136,193,.05), transparent 40%);
  }
  .bubble {
    max-width: 78%; padding: 7px 12px 8px; border-radius: 16px; font-size: 15px;
    line-height: 1.35; word-wrap: break-word; position: relative;
  }
  .bubble.in { align-self: flex-start; background: var(--bubble-in); border-bottom-left-radius: 5px; }
  .bubble.out { align-self: flex-end; background: var(--bubble-out); border-bottom-right-radius: 5px; }
  .bubble .time { display: inline-block; font-size: 10.5px; color: var(--text-dim); margin-top: 3px; float: right; margin-left: 8px; }

  .composer {
    display: flex; align-items: flex-end; gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
    background: var(--panel); flex-shrink: 0;
  }
  .composer textarea {
    flex: 1; resize: none; max-height: 100px; min-height: 40px;
    background: var(--panel-hover); border: none; border-radius: 20px;
    padding: 10px 15px; color: var(--text); font-size: 15.5px; font-family: inherit; outline: none;
  }
  .send-btn {
    width: 40px; height: 40px; border-radius: 50%; background: var(--accent-bright); border: none;
    color: #0e1621; font-size: 17px; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .send-btn:disabled { opacity: .4; }

  .empty, .loading { text-align: center; color: var(--text-dim); padding: 40px 20px; font-size: 14px; }
  .error-banner { background: #4a2020; color: #ff8080; font-size: 13px; padding: 8px 14px; text-align: center; }

  .navbar {
    display: flex; background: var(--panel); box-shadow: 0 -1px 0 rgba(0,0,0,.35);
    flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .nav-btn {
    flex: 1; padding: 8px 0 6px; text-align: center; color: var(--text-dim);
    font-size: 10.5px; cursor: pointer; user-select: none;
  }
  .nav-btn .ico { font-size: 22px; display: block; margin-bottom: 2px; }
  .nav-btn.active { color: var(--accent-bright); }

  #screen-more { position: absolute; inset: 0; display: none; flex-direction: column; }
  #screen-more.active { display: flex; }
  #screen-list.hidden { display: none; }

  .section-title { padding: 16px 16px 6px; font-size: 12.5px; color: var(--accent-bright); font-weight: 600; }
  .list-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 13px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .list-row:active { background: var(--panel-hover); }
  .list-row .label { font-size: 15.5px; }
  .list-row .sub { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }
  .pill { font-size: 11.5px; padding: 3px 9px; border-radius: 10px; background: var(--panel-hover); color: var(--text-dim); }
  .pill.active-pill { background: var(--accent-bright); color: #0e1621; font-weight: 600; }

  .form-box { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .form-box input {
    background: var(--panel-hover); border: none; border-radius: 10px; padding: 11px 13px;
    color: var(--text); font-size: 15.5px; outline: none; font-family: inherit;
  }
  .form-box button {
    background: var(--accent-bright); border: none; border-radius: 10px; padding: 12px; color: #0e1621;
    font-size: 15.5px; font-weight: 700; cursor: pointer;
  }
  .form-box button:disabled { opacity: .5; }
  .gift-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 16px; }
  .gift-card {
    background: var(--panel-hover); border-radius: 14px; padding: 16px; text-align: center; cursor: pointer;
    border: 2px solid transparent;
  }
  .gift-card.selected { border-color: var(--accent-bright); }
  .gift-card .emoji { font-size: 30px; }
  .gift-card .price { font-size: 13px; color: var(--text-dim); margin-top: 5px; font-weight: 600; }
</style>
</head>
<body>

<div id="screen-list">
  <div class="topbar"><h1>Чаты</h1></div>
  <div class="search-wrap">
    <div class="search-box">
      <span class="icon">🔍</span>
      <input id="searchInput" placeholder="Поиск">
    </div>
  </div>
  <div id="dialogs"><div class="loading">Загрузка чатов...</div></div>
  <div class="navbar">
    <div class="nav-btn active" id="navChats"><span class="ico">💬</span>Чаты</div>
    <div class="nav-btn" id="navMore"><span class="ico">⋯</span>Ещё</div>
  </div>
</div>

<div id="screen-more">
  <div class="topbar"><h1 id="moreTitle">Ещё</h1></div>
  <div id="moreBody" style="flex:1; overflow-y:auto;"></div>
  <div class="navbar">
    <div class="nav-btn" id="navChats2"><span class="ico">💬</span>Чаты</div>
    <div class="nav-btn active" id="navMore2"><span class="ico">⋯</span>Ещё</div>
  </div>
</div>

<div id="screen-chat">
  <div class="topbar">
    <span class="back-btn" id="backBtn">‹</span>
    <div class="chat-header-avatar" id="chatHeaderAvatar"></div>
    <h1 id="chatTitle">Чат</h1>
  </div>
  <div id="messages"><div class="loading">Загрузка сообщений...</div></div>
  <div class="composer">
    <textarea id="msgInput" placeholder="Сообщение" rows="1"></textarea>
    <button class="send-btn" id="sendBtn">➤</button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const initData = tg?.initData || '';

let currentDialogId = null;
let currentDialogName = '';

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': initData, ...(options.headers || {}) }
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function initials(name) {
  return (name || '?').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
}
// Та же палитра, что использует настоящий Telegram для цветных аватарок без фото
const AVATAR_COLORS = ['#e17076', '#eda86c', '#a695e7', '#7bc862', '#6ec9cb', '#65aadd', '#ee7aae'];
function avatarColor(name) {
  let hash = 0;
  for (let i = 0; i < (name || '').length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[hash % AVATAR_COLORS.length];
}
function formatTime(ms) {
  if (!ms) return '';
  const d = new Date(ms);
  const today = new Date();
  const isToday = d.toDateString() === today.toDateString();
  return isToday
    ? d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })
    : d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
}
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

let allDialogs = [];
async function loadDialogs() {
  const el = document.getElementById('dialogs');
  try {
    const { dialogs } = await api('/api/dialogs');
    allDialogs = dialogs;
    renderDialogList(dialogs);
  } catch (e) {
    el.innerHTML = `<div class="error-banner">Ошибка загрузки: ${escapeHtml(e.message)}</div>`;
  }
}
function renderDialogList(dialogs) {
  const el = document.getElementById('dialogs');
  if (!dialogs.length) { el.innerHTML = '<div class="empty">Чатов не найдено</div>'; return; }
  el.innerHTML = '';
  dialogs.forEach((d) => {
    const item = document.createElement('div');
    item.className = 'dialog-item';
    item.innerHTML = `
      <div class="avatar" style="background:${avatarColor(d.name)}">${initials(d.name)}</div>
      <div class="dialog-info">
        <div class="dialog-top-row">
          <div class="dialog-name">${escapeHtml(d.name)}</div>
          <div class="dialog-time">${formatTime(d.date)}</div>
        </div>
        <div class="dialog-bottom-row">
          <div class="dialog-last">${escapeHtml(d.lastMessage || '')}</div>
          ${d.unreadCount ? `<div class="unread-badge">${d.unreadCount}</div>` : ''}
        </div>
      </div>`;
    item.onclick = () => openChat(d.id, d.name);
    el.appendChild(item);
  });
}
document.getElementById('searchInput').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  renderDialogList(q ? allDialogs.filter((d) => d.name.toLowerCase().includes(q)) : allDialogs);
});

async function openChat(id, name) {
  currentDialogId = id;
  currentDialogName = name;
  document.getElementById('chatTitle').textContent = name;
  const headerAvatar = document.getElementById('chatHeaderAvatar');
  headerAvatar.textContent = initials(name);
  headerAvatar.style.background = avatarColor(name);
  document.getElementById('screen-chat').classList.add('active');
  const el = document.getElementById('messages');
  el.innerHTML = '<div class="loading">Загрузка сообщений...</div>';
  try {
    const { messages } = await api(`/api/messages?chatId=${encodeURIComponent(id)}`);
    if (!messages.length) { el.innerHTML = '<div class="empty">Сообщений пока нет</div>'; return; }
    el.innerHTML = '';
    messages.forEach((m) => {
      const b = document.createElement('div');
      b.className = 'bubble ' + (m.out ? 'out' : 'in');
      b.innerHTML = `${escapeHtml(m.text)}<span class="time">${formatTime(m.date)}</span>`;
      el.appendChild(b);
    });
    el.scrollTop = el.scrollHeight;
  } catch (e) {
    el.innerHTML = `<div class="error-banner">Ошибка загрузки: ${escapeHtml(e.message)}</div>`;
  }
}

function closeChat() {
  document.getElementById('screen-chat').classList.remove('active');
  currentDialogId = null;
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !currentDialogId) return;
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  try {
    await api('/api/send', { method: 'POST', body: JSON.stringify({ chatId: currentDialogId, text }) });
    input.value = '';
    input.style.height = 'auto';
    await openChat(currentDialogId, currentDialogName);
  } catch (e) {
    alert('Не удалось отправить: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('backBtn').onclick = closeChat;
document.getElementById('sendBtn').onclick = sendMessage;
const input = document.getElementById('msgInput');
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; });
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

// ====== НАВИГАЦИЯ ЧАТЫ / ЕЩЁ ======
function showChatsTab() {
  document.getElementById('screen-list').classList.remove('hidden');
  document.getElementById('screen-more').classList.remove('active');
  document.getElementById('navChats').classList.add('active');
  document.getElementById('navMore').classList.remove('active');
}
function showMoreTab() {
  document.getElementById('screen-list').classList.add('hidden');
  document.getElementById('screen-more').classList.add('active');
  document.getElementById('navChats').classList.remove('active');
  document.getElementById('navMore').classList.add('active');
  renderMoreMenu();
}
document.getElementById('navChats').onclick = showChatsTab;
document.getElementById('navChats2').onclick = showChatsTab;
document.getElementById('navMore').onclick = showMoreTab;
document.getElementById('navMore2').onclick = showMoreTab;

function moreHeader(title, showBack) {
  const titleEl = document.getElementById('moreTitle');
  titleEl.innerHTML = '';
  if (showBack) {
    const back = document.createElement('span');
    back.className = 'back-btn';
    back.style.marginRight = '8px';
    back.textContent = '‹';
    back.onclick = renderMoreMenu;
    titleEl.appendChild(back);
  }
  titleEl.appendChild(document.createTextNode(title));
}

function renderMoreMenu() {
  moreHeader('Ещё', null);
  const el = document.getElementById('moreBody');
  el.innerHTML = `
    <div class="section-title">Аккаунт</div>
    <div class="list-row" id="rowAccounts"><span class="label">🔄 Сменить аккаунт</span><span class="pill">›</span></div>
    <div class="section-title">Звёзды</div>
    <div class="list-row" id="rowGifts"><span class="label">🎁 Отправить подарок</span><span class="pill">›</span></div>
    <div class="list-row" id="rowNft"><span class="label">💎 Мои NFT-подарки</span><span class="pill">›</span></div>
  `;
  document.getElementById('rowAccounts').onclick = renderAccountsScreen;
  document.getElementById('rowGifts').onclick = renderGiftsScreen;
  document.getElementById('rowNft').onclick = renderNftScreen;
}

async function renderAccountsScreen() {
  moreHeader('Мои аккаунты', true);
  const el = document.getElementById('moreBody');
  el.innerHTML = '<div class="loading">Загрузка...</div>';
  try {
    const { accounts } = await api('/api/accounts');
    el.innerHTML = '';
    if (!accounts.length) {
      el.innerHTML = '<div class="empty">Аккаунтов нет</div>';
    }
    accounts.forEach((a) => {
      const row = document.createElement('div');
      row.className = 'list-row';
      row.innerHTML = `<span class="label">${escapeHtml(a.label)}</span><span class="pill ${a.active ? 'active-pill' : ''}">${a.active ? 'активен' : 'выбрать'}</span>`;
      if (!a.active) row.onclick = async () => {
        row.querySelector('.pill').textContent = '...';
        try { await api('/api/accounts/switch', { method: 'POST', body: JSON.stringify({ accountId: a.id }) }); await renderAccountsScreen(); await loadDialogs(); }
        catch (e) { alert('Ошибка: ' + e.message); }
      };
      el.appendChild(row);
    });

    const addBox = document.createElement('div');
    addBox.className = 'form-box';
    addBox.innerHTML = `
      <div class="section-title" style="padding:8px 0 0">Добавить аккаунт</div>
      <input id="newSessionInput" placeholder="Session string">
      <button id="addAccountBtn">+ Добавить аккаунт</button>
    `;
    el.appendChild(addBox);
    document.getElementById('addAccountBtn').onclick = async () => {
      const btn = document.getElementById('addAccountBtn');
      const val = document.getElementById('newSessionInput').value.trim();
      if (!val) return;
      btn.disabled = true; btn.textContent = 'Проверяю...';
      try {
        const { label } = await api('/api/accounts/add', { method: 'POST', body: JSON.stringify({ sessionString: val }) });
        btn.textContent = `✅ Подключён: ${label}`;
        await renderAccountsScreen();
        await loadDialogs();
      } catch (e) {
        alert('Не удалось подключить: ' + e.message);
        btn.disabled = false; btn.textContent = '+ Добавить аккаунт';
      }
    };
  } catch (e) {
    el.innerHTML = `<div class="error-banner">${escapeHtml(e.message)}</div>`;
  }
}

let selectedGiftId = null;
async function renderGiftsScreen() {
  moreHeader('Отправить подарок', true);
  selectedGiftId = null;
  const el = document.getElementById('moreBody');
  el.innerHTML = '<div class="loading">Загрузка каталога...</div>';
  try {
    const { gifts } = await api('/api/gifts/catalog');
    el.innerHTML = `
      <div class="gift-grid" id="giftGrid"></div>
      <div class="form-box">
        <input id="giftRecipient" placeholder="Юзернейм получателя, без @">
        <button id="giftSendBtn" disabled>Отправить подарок</button>
      </div>`;
    const grid = document.getElementById('giftGrid');
    gifts.forEach((g) => {
      const card = document.createElement('div');
      card.className = 'gift-card';
      card.innerHTML = `<div class="emoji">${g.name.split(' ')[0]}</div><div class="price">${g.price}⭐</div>`;
      card.onclick = () => { selectedGiftId = g.id; [...grid.children].forEach((c) => c.classList.remove('selected')); card.classList.add('selected'); };
      grid.appendChild(card);
    });
    document.getElementById('giftSendBtn').onclick = async () => {
      const btn = document.getElementById('giftSendBtn');
      const recipient = document.getElementById('giftRecipient').value.trim();
      if (!selectedGiftId || !recipient) return;
      btn.disabled = true; btn.textContent = 'Отправляю...';
      try {
        await api('/api/gifts/send', { method: 'POST', body: JSON.stringify({ recipientUsername: recipient, giftId: selectedGiftId }) });
        btn.textContent = 'Отправлено ✅';
      } catch (e) {
        alert('Ошибка: ' + e.message);
        btn.disabled = false; btn.textContent = 'Отправить подарок';
      }
    };
    document.getElementById('giftRecipient').addEventListener('input', () => {
      document.getElementById('giftSendBtn').disabled = !(selectedGiftId && document.getElementById('giftRecipient').value.trim());
    });
  } catch (e) {
    el.innerHTML = `<div class="error-banner">${escapeHtml(e.message)}</div>`;
  }
}

async function renderNftScreen() {
  moreHeader('Мои NFT-подарки', true);
  const el = document.getElementById('moreBody');
  el.innerHTML = '<div class="loading">Загрузка...</div>';
  try {
    const { nft } = await api('/api/nft/list');
    if (!nft.length) { el.innerHTML = '<div class="empty">Уникальных NFT-подарков нет</div>'; return; }
    el.innerHTML = '';
    nft.forEach((n) => {
      const row = document.createElement('div');
      row.className = 'list-row';
      row.innerHTML = `<span><span class="label">💎 ${escapeHtml(n.title)} #${n.num || ''}</span><div class="sub">${n.forSale ? 'выставлен на продажу' : 'не продаётся'}</div></span><span class="pill">Продать</span>`;
      row.onclick = async () => {
        const price = prompt('Цена в звёздах:');
        const num = Number(price);
        if (!num || num <= 0) return;
        try { await api('/api/nft/sell', { method: 'POST', body: JSON.stringify({ idx: n.idx, priceStars: num }) }); await renderNftScreen(); }
        catch (e) { alert('Ошибка: ' + e.message); }
      };
      el.appendChild(row);
    });
  } catch (e) {
    el.innerHTML = `<div class="error-banner">${escapeHtml(e.message)}</div>`;
  }
}

loadDialogs();
</script>
</body>
</html>
